<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixed Gear Ratio Calculator</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="banner">
    <div class="brand">FIXED GEAR RATIO CALCULATOR</div>
    <nav class="nav">
      <span>FIXIE BUILD INSPIRATION</span>
      <span>BLOG</span>
      <span>SHOP</span>
    </nav>
  </header>

  <main class="main">
    <div class="layout">

      <!-- TABLE -->
      <section class="table-container">
        <div class="table-wrap">
          <div class="y-label">Cog Teeth</div>

          <div class="table-grid">

            <!-- Chainring label (centered over ratio columns only) -->
            <div class="x-label">Chainring Teeth</div>

            <!-- Corner (blank) -->
            <div class="corner"></div>

            <!-- X axis (chainrings) -->
            <div id="xAxis" class="x-axis"></div>

            <!-- Y axis (cogs) -->
            <div id="yAxis" class="y-axis"></div>

            <!-- Ratio matrix -->
            <div id="matrix" class="matrix"></div>

          </div>
        </div>
      </section>

      <!-- OUTPUT -->
      <aside class="output-container">
        <div class="output-title">My Ratio</div>
        <div class="output-box">
          <div class="selection">–</div>
          <div id="ratio"></div>
          <div id="skid"></div>
        </div>
      </aside>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
