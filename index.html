<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Fixed Gear Ratio Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <main class="page">
    <h1>Fixed Gear Ratio Calculator</h1>

    <section class="layout">
      <!-- LEFT: TABLE -->
      <div class="tableBlock">
        <div class="xTitle">Chainring Teeth</div>

        <div class="tableWrap">
          <div class="yTitle">Cog Teeth</div>

          <div class="tableShell">
            <div class="topRow">
              <div class="corner"></div>
              <div id="xAxis" class="xAxis"></div>
            </div>

            <div class="bodyRow">
              <div id="yAxis" class="yAxis"></div>
              <div id="matrix" class="matrix" aria-label="ratio matrix"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: OUTPUT -->
      <aside class="info">
        <div class="setup" id="setup">Click a ratio</div>
        <div class="metric" id="metricRatio"></div>
        <div class="metric" id="metricSkid"></div>
        <div class="hint" id="hint"></div>
      </aside>
    </section>
  </main>
</body>
</html>
