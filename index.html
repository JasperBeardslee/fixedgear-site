<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixed Gear Ratio Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Fixed Gear Ratio Calculator</h1>

    <div class="layout">

      <!-- TABLE -->
      <div class="table-container">

        <div class="x-label">Chainring Teeth</div>

        <div class="table-wrap">
          <div class="y-label">Cog Teeth</div>

          <div class="table-core">

            <div id="xAxis" class="x-axis"></div>

            <div class="body">
              <div id="yAxis" class="y-axis"></div>
              <div id="matrix" class="matrix"></div>
            </div>

          </div>
        </div>
      </div>

      <!-- OUTPUT -->
      <div class="output">
        <p class="selection">Click a ratio</p>
        <p id="ratio"></p>
        <p id="skid"></p>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
