<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fixed Gear Ratio Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">
    <h1>Fixed Gear Ratio Calculator</h1>

    <div class="x-axis-title">Chainring Teeth</div>

    <div class="table-area">
      <div class="y-axis-title">Cog Teeth</div>
      <div id="gearGrid" class="gear-grid" aria-label="Fixed gear ratio table"></div>
    </div>

    <section class="info">
      <div class="setup" id="setup">Click a ratio</div>
      <div class="metric" id="metricRatio"></div>
      <div class="metric" id="metricSkid"></div>
      <div class="hoverHint" id="hoverHint"></div>
    </section>
  </main>
</body>
</html>
